# Render Blueprint — click "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: failureai
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: "true"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: PUBLIC_SITE_URL
        sync: false          # apna domain daalein, e.g. https://failureai.com
      - key: OPENAI_API_KEY
        sync: false          # optional — chhod do to Local Engine chalega
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        sync: false          # tavily | serper | brave | none
      - key: SEARCH_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
